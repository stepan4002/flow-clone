<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="Animated illustration: hold Ctrl+Win, say 'um so hey team comma the demo is ready exclamation mark', release, and 'So hey team, the demo is ready!' is typed into the chat box">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <clipPath id="reveal">
      <rect x="76" y="170" height="40" width="0">
        <animate attributeName="width" dur="8s" repeatCount="indefinite"
                 values="0;0;470;470;0" keyTimes="0;0.62;0.8;0.97;1"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="720" height="380" rx="18" fill="#0f172a"/>

  <g font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
    <!-- app window -->
    <rect x="40" y="30" width="640" height="210" rx="12" fill="#111827" stroke="#334155"/>
    <circle cx="62" cy="52" r="6" fill="#ef4444"/>
    <circle cx="82" cy="52" r="6" fill="#f59e0b"/>
    <circle cx="102" cy="52" r="6" fill="#22c55e"/>
    <text x="360" y="57" font-size="14" fill="#94a3b8" text-anchor="middle">Chat — #team</text>
    <line x1="40" y1="72" x2="680" y2="72" stroke="#334155"/>

    <text x="64" y="108" font-size="15" fill="#94a3b8">Alex</text>
    <text x="64" y="132" font-size="16" fill="#e2e8f0">Is the demo ready for this afternoon?</text>

    <!-- input box -->
    <rect x="60" y="168" width="600" height="44" rx="10" fill="#1f2937" stroke="#475569"/>
    <text x="76" y="196" font-size="17" fill="#ffffff" clip-path="url(#reveal)">So hey team, the demo is ready!</text>
    <rect x="76" y="180" width="2" height="22" fill="#e2e8f0">
      <animate attributeName="x" dur="8s" repeatCount="indefinite"
               values="76;76;318;318;76" keyTimes="0;0.62;0.8;0.97;1"/>
      <animate attributeName="opacity" dur="1s" repeatCount="indefinite" values="1;0;1" keyTimes="0;0.5;1" calcMode="discrete"/>
    </rect>

    <!-- what you say -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
               values="0;0;1;1;0;0" keyTimes="0;0.13;0.18;0.55;0.6;1"/>
      <text x="360" y="272" font-size="14" fill="#94a3b8" text-anchor="middle">you say</text>
      <text x="360" y="296" font-size="17" font-style="italic" fill="#cbd5e1" text-anchor="middle">“um so hey team comma the demo is ready exclamation mark”</text>
    </g>

    <!-- transcribing hint -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
               values="0;0;1;1;0;0" keyTimes="0;0.56;0.58;0.64;0.66;1"/>
      <text x="360" y="284" font-size="15" fill="#a5b4fc" text-anchor="middle">transcribing locally… ~0.3 s</text>
    </g>

    <!-- keycaps -->
    <g font-size="16" font-weight="600" text-anchor="middle">
      <rect x="230" y="320" width="84" height="40" rx="8" fill="#1e293b" stroke="#475569">
        <animate attributeName="fill" dur="8s" repeatCount="indefinite" calcMode="discrete"
                 values="#1e293b;#6366f1;#1e293b" keyTimes="0;0.12;0.55"/>
      </rect>
      <text x="272" y="346" fill="#e2e8f0">Ctrl</text>
      <text x="330" y="346" fill="#64748b">+</text>
      <rect x="346" y="320" width="84" height="40" rx="8" fill="#1e293b" stroke="#475569">
        <animate attributeName="fill" dur="8s" repeatCount="indefinite" calcMode="discrete"
                 values="#1e293b;#6366f1;#1e293b" keyTimes="0;0.12;0.55"/>
      </rect>
      <text x="388" y="346" fill="#e2e8f0">Win</text>
    </g>

    <!-- listening pill -->
    <g opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete"
               values="0;1;0" keyTimes="0;0.12;0.55"/>
      <rect x="452" y="322" width="150" height="36" rx="18" fill="url(#accent)"/>
      <circle cx="472" cy="340" r="5" fill="#ffffff"/>
      <text x="486" y="345" font-size="14" font-weight="600" fill="#ffffff">Listening</text>
      <g fill="#ffffff">
        <rect x="560" y="332" width="4" height="16" rx="2"><animate attributeName="height" dur="0.6s" repeatCount="indefinite" values="6;16;6"/><animate attributeName="y" dur="0.6s" repeatCount="indefinite" values="337;332;337"/></rect>
        <rect x="568" y="332" width="4" height="16" rx="2"><animate attributeName="height" dur="0.5s" repeatCount="indefinite" values="14;5;14"/><animate attributeName="y" dur="0.5s" repeatCount="indefinite" values="333;337.5;333"/></rect>
        <rect x="576" y="332" width="4" height="16" rx="2"><animate attributeName="height" dur="0.7s" repeatCount="indefinite" values="8;18;8"/><animate attributeName="y" dur="0.7s" repeatCount="indefinite" values="336;331;336"/></rect>
        <rect x="584" y="332" width="4" height="16" rx="2"><animate attributeName="height" dur="0.55s" repeatCount="indefinite" values="12;4;12"/><animate attributeName="y" dur="0.55s" repeatCount="indefinite" values="334;338;334"/></rect>
      </g>
    </g>
  </g>
</svg>
