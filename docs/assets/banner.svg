<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="FlowClone — free, 100% offline voice dictation for Windows and Android">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>

  <!-- decorative waveform -->
  <g fill="url(#accent)" opacity="0.18">
    <rect x="900" y="170" width="14" height="60" rx="7"/>
    <rect x="930" y="130" width="14" height="140" rx="7"/>
    <rect x="960" y="90"  width="14" height="220" rx="7"/>
    <rect x="990" y="140" width="14" height="120" rx="7"/>
    <rect x="1020" y="70" width="14" height="260" rx="7"/>
    <rect x="1050" y="120" width="14" height="160" rx="7"/>
    <rect x="1080" y="155" width="14" height="90" rx="7"/>
    <rect x="1110" y="105" width="14" height="190" rx="7"/>
    <rect x="1140" y="160" width="14" height="80" rx="7"/>
    <rect x="1170" y="180" width="14" height="40" rx="7"/>
  </g>

  <!-- mic logo -->
  <circle cx="170" cy="200" r="92" fill="url(#accent)"/>
  <g fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round">
    <rect x="146" y="132" width="48" height="88" rx="24" fill="#ffffff" stroke="none"/>
    <path d="M122 196 a48 48 0 0 0 96 0"/>
    <line x1="170" y1="244" x2="170" y2="266"/>
  </g>

  <g font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
    <text x="300" y="185" font-size="92" font-weight="700" fill="#ffffff">FlowClone</text>
    <text x="304" y="238" font-size="30" fill="#c7d2fe">Free, 100% offline voice dictation for Windows &amp; Android</text>

    <g font-size="20" fill="#e0e7ff">
      <rect x="304" y="270" width="270" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#818cf8" stroke-opacity="0.5"/>
      <text x="439" y="297" text-anchor="middle">Hold Ctrl+Win · speak · release</text>
      <rect x="588" y="270" width="190" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#818cf8" stroke-opacity="0.5"/>
      <text x="683" y="297" text-anchor="middle">EN · CS · FR · ES</text>
      <rect x="792" y="270" width="290" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#818cf8" stroke-opacity="0.5"/>
      <text x="937" y="297" text-anchor="middle">No cloud · No account · $0</text>
    </g>
  </g>
</svg>
