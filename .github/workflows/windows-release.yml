name: Windows release

# Builds FlowClone-Setup.exe on a tag (attached to that tag's draft release) or on demand
# (workflow artifact only). See RELEASING.md for the whole release checklist.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: FlowClone.exe + installer
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $v = (Select-String -Path windows/flowclone/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") {
            Write-Error "Tag ${{ github.ref_name }} does not match __version__ $v (windows/flowclone/__init__.py)"
            exit 1
          }

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: windows/requirements-build.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r windows/requirements-build.txt pytest

      - name: Unit tests
        run: python -m pytest -q windows/tests

      - name: Third-party notices
        working-directory: windows
        run: python tools/gen_notices.py

      - name: PyInstaller
        working-directory: windows
        run: python -m PyInstaller --noconfirm --clean FlowClone.spec

      - name: Self-test of the built app
        timeout-minutes: 5
        run: |
          $p = Start-Process windows\dist\FlowClone\FlowClone.exe -ArgumentList '--selftest' -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Error 'selftest timed out'; exit 1 }
          Get-Content "$env:TEMP\FlowClone-selftest.log"
          exit $p.ExitCode

      - name: Installer (Inno Setup 6)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc windows\installer\FlowClone.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Code signing goes here once a certificate exists (see SECURITY.md). It must sign
      # dist\FlowClone\FlowClone.exe before the installer step and the setup after it.

      - name: Checksum
        working-directory: windows/installer/Output
        run: |
          $h = (Get-FileHash FlowClone-Setup.exe -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD\FlowClone-Setup.exe.sha256", "$h *FlowClone-Setup.exe`n")
          Get-Content FlowClone-Setup.exe.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: FlowClone-Setup
          path: |
            windows/installer/Output/FlowClone-Setup.exe
            windows/installer/Output/FlowClone-Setup.exe.sha256
          retention-days: 30

      - name: Attach to the release (draft if new)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            windows/installer/Output/FlowClone-Setup.exe
            windows/installer/Output/FlowClone-Setup.exe.sha256
