name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-app:
    name: Windows app (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Byte-compile every module
        run: python -m compileall -q windows/flowclone windows/run.py
      - name: Unit tests (cleanup + dictionary; pure Python, no audio/GUI deps)
        run: |
          pip install pytest
          python -m pytest -q windows/tests

  android-app:
    name: Android app (debug APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Fetch sherpa-onnx AAR
        working-directory: android
        run: ./fetch-deps.sh
      - name: Build
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: FlowKey-debug-no-model
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
